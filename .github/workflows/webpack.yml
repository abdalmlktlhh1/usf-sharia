name: Verify web and functions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Test course catalog and Firestore rules alignment
        run: npm test
      - name: Test Firestore profile security rules in emulator
        run: npm run test:rules
      - name: Build offline-ready web bundle
        run: npm run build
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Check Cloud Functions syntax
        run: npm --prefix functions run lint
